<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Detail — GAMEVERSE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css?v=8.0">
  <link rel="stylesheet" href="css/cards.css?v=8.0">
  <link rel="stylesheet" href="css/admin.css?v=8.0">
  <link rel="stylesheet" href="css/game-detail.css?v=8.0">
  <link rel="stylesheet" href="css/responsive.css?v=8.0">
</head>
<body>
  <!-- Minimal Floating Header -->
  <header class="floating-header">
    <a href="index.html" class="brand-logo">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"></rect><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"></path></svg>
      <span>GAME<span class="logo-accent">VERSE</span></span>
    </a>

    <div class="top-icon-cluster">
      <!-- Search Button -->
      <button class="icon-circle-btn" id="searchToggle" title="Search Collection (Press / or Ctrl+K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
      </button>

      <!-- Avatar Button -->
      <div class="avatar-circle-btn" id="avatarBtn" title="Admin / Profile">V</div>
    </div>
  </header>

  <!-- Spotlight Search Modal Overlay -->
  <div class="spotlight-overlay hidden" id="searchOverlay">
    <div class="spotlight-dialog glass-panel">
      <div class="spotlight-input-row">
        <svg class="spotlight-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search any game in universe (title, genre, platform)..." autocomplete="off">
        <button class="spotlight-close" id="searchClose">&times;</button>
      </div>
      <div class="spotlight-results hidden" id="searchResults"></div>
    </div>
  </div>

  <!-- Outer Window Frame -->
  <div class="game-detail-app-frame">
    
    <!-- Hero Card with Embedded Artwork, Top Navigation & Headline -->
    <div class="game-detail-hero-card">
      <!-- Background Artwork Layer (fades into black on left & bottom) -->
      <div class="hero-backdrop" id="gameHeroBg">
        <img id="gameHeroImg" class="hero-img-element" alt="Game Artwork" />
      </div>
      <div class="hero-backdrop-gradient"></div>
      
      <!-- Top Action Bar Inside Hero Card -->
      <div class="hero-top-nav">
        <a href="index.html" class="hero-back-pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to Collection
        </a>
        
        <div class="hero-right-actions">
          <button class="hero-circle-btn" id="bookmarkBtn" title="Toggle Bookmark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>

          <button class="hero-circle-btn" id="favoriteBtn" title="Toggle Favorite">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          
          <div class="more-menu-wrapper">
            <button class="hero-circle-btn" id="adminMenuToggle" title="More Options">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
            <div class="more-dropdown glass-panel hidden" id="adminMenuDropdown">
              <button id="editGameBtn">✏️ Edit Game</button>
              <button id="deleteGameBtn" class="delete-opt">🗑️ Delete Game</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Hero Details Info (Status Badge, Huge Title, Tagline) -->
      <div class="hero-text-content">
        <div class="hero-status-tag" id="gameStatusTag">PLAYING</div>
        <h1 class="hero-game-title" id="gameName">Loading Game...</h1>
        <p class="hero-game-tagline" id="gameDescription"></p>
      </div>
    </div>

    <!-- Tabs Navigation Bar (Overview, System Requirements, Related) -->
    <div class="detail-tabs-bar">
      <button class="detail-tab active" data-tab="overview">Overview</button>
      <button class="detail-tab" data-tab="sysreq">System Requirements</button>
      <button class="detail-tab" data-tab="related">Related</button>
    </div>

    <!-- Tab 1: Overview Panel -->
    <div class="tab-panel active" id="tab-overview">
      <!-- 5-Column Metadata Info Strip -->
      <div class="meta-strip-card" id="quickInfoRow">
        <!-- Injected dynamically via JS: Genre, Developer, Released, Platform, Engine -->
      </div>

      <!-- 2-Column Split: About This Game (Left) & My Status (Right) -->
      <div class="overview-two-col">
        <!-- Left: About This Game -->
        <div class="content-box about-box">
          <h2 class="box-title">About This Game</h2>
          <div class="box-desc about-text-content" id="gameFullDescription"></div>
        </div>

        <!-- Right: My Status -->
        <div class="content-box status-box">
          <h2 class="box-title">My Status</h2>
          <div class="status-buttons-row" id="statusSelector">
            <button class="status-choice-btn" data-val="not_started">
              <span class="status-btn-icon">◇</span> Not Started
            </button>
            <button class="status-choice-btn active" data-val="playing">
              <span class="status-btn-icon">▷</span> Playing
            </button>
            <button class="status-choice-btn" data-val="completed">
              <span class="status-btn-icon">✔</span> Completed
            </button>
            <button class="status-choice-btn" data-val="play_later">
              <span class="status-btn-icon">⏱</span> Play Later
            </button>
            <button class="status-choice-btn" data-val="wont_play">
              <span class="status-btn-icon">⏸</span> Won't Play
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: System Requirements Panel -->
    <div class="tab-panel" id="tab-sysreq">
      <div class="sysreq-split-grid">
        <div class="content-box sysreq-box">
          <h2 class="box-title">Minimum Requirements</h2>
          <table class="sysreq-table" id="sysreqMin"></table>
        </div>
        <div class="content-box sysreq-box sysreq-rec">
          <h2 class="box-title" style="color:#d98caf">Recommended Requirements</h2>
          <table class="sysreq-table" id="sysreqRec"></table>
        </div>
      </div>
    </div>

    <!-- Tab 3: Related Games Panel -->
    <div class="tab-panel" id="tab-related">
      <div class="related-games-grid" id="relatedGamesGrid">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </div>

  <!-- Admin Login Modal -->
  <div class="modal-overlay hidden" id="loginModal">
    <div class="modal glass-panel">
      <button class="modal-close" id="loginClose">&times;</button>
      <h3>Admin Login</h3>
      <form id="loginForm">
        <div class="form-group">
          <input type="text" name="username" placeholder="Username" required>
        </div>
        <div class="form-group">
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <p class="error-msg hidden" id="loginError">Invalid credentials</p>
        <button type="submit" class="btn-primary" style="width:100%">Login</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js?v=8.0"></script>
  <script src="js/auth.js?v=9.0"></script>
  <script src="js/cards.js?v=9.0"></script>
  <script src="js/search.js?v=9.0"></script>
  <script src="js/game-detail.js?v=8.0"></script>
</body>
</html>
