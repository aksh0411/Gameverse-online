<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — GameVerse</title>
  <link rel="stylesheet" href="css/style.css?v=9.1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090614;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .reset-card {
      background: rgba(18, 14, 32, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(114, 9, 183, 0.2);
      text-align: center;
    }
    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      display: inline-block;
      color: #fff;
      text-decoration: none;
    }
    .brand-logo span { color: #f72585; }
    h2 { margin: 0 0 10px; font-size: 1.5rem; color: #fff; }
    p.sub { font-size: 0.88rem; color: #aaa; margin: 0 0 24px; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: #ccc; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #ffb074;
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #7209b7, #f72585);
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg-box {
      font-size: 0.88rem;
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
    }
    .msg-error { background: rgba(255, 92, 124, 0.15); color: #ff5c7c; }
    .msg-success { background: rgba(255, 176, 116, 0.15); color: #ffb074; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #ffb074; }
  </style>
</head>
<body>
  <div class="reset-card">
    <a href="index.html" class="brand-logo">GAME<span>VERSE</span></a>
    <h2>New Password</h2>
    <p class="sub">Please enter your new password below.</p>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat new password" minlength="6" required>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
      <div id="statusMsg" class="msg-box" style="display:none;"></div>
    </form>

    <a href="index.html" class="back-link">← Return to GameVerse</a>
  </div>

  <script>
    (async function() {
      const form = document.getElementById('resetForm');
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      function showStatus(text, isError) {
        statusMsg.style.display = 'block';
        statusMsg.className = 'msg-box ' + (isError ? 'msg-error' : 'msg-success');
        statusMsg.textContent = text;
      }

      // Fetch config & init Supabase
      let supabaseClient = null;
      try {
        const res = await fetch('/api/auth/config');
        const config = await res.json();
        if (config.supabase_url && config.supabase_anon_key && window.supabase) {
          supabaseClient = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);
        }
      } catch(e) {}

      if (!supabaseClient) {
        showStatus('Authentication service unavailable. Please try again later.', true);
        submitBtn.disabled = true;
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (pwd !== confirm) {
          showStatus('Passwords do not match.', true);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating…';

        try {
          const { error } = await supabaseClient.auth.updateUser({ password: pwd });
          if (error) throw error;

          showStatus('Password updated successfully! Redirecting to home…', false);
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } catch (err) {
          showStatus(err.message || 'Failed to update password.', true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    })();
  </script>
</body>
</html>
